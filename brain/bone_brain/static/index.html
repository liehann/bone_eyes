<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skull Brain</title>
<style>
  :root {
    --bg: #0e0d0c; --panel: #181614; --line: #2a2622; --text: #ece6dc; --muted: #9a9086;
    --accent: #ff7a1a; --accent2: #ffb347; --ok: #6fcf7a; --err: #ff5d5d; --visitor: #8fb8ff;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, -apple-system, sans-serif; }
  header { display: flex; align-items: center; gap: 12px; padding: 14px 20px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  h1 { font-size: 18px; margin: 0; letter-spacing: .02em; }
  .pill { padding: 3px 10px; border-radius: 999px; background: var(--line); font-size: 13px; }
  .pill.state { background: #3a2410; color: var(--accent2); font-weight: 600; }
  .pill.bad { background: #3a1414; color: var(--err); }
  main { display: grid; grid-template-columns: 320px 1fr; gap: 16px; padding: 16px 20px; max-width: 1200px; }
  @media (max-width: 800px) { main { grid-template-columns: 1fr; padding: 12px 16px; } }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px; }
  section + section { margin-top: 16px; }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 0 10px; font-weight: 600; }
  button { background: var(--line); color: var(--text); border: 1px solid #3a352f; border-radius: 8px; padding: 8px 12px; font: inherit; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #1a0e02; font-weight: 600; }
  button.stop { color: var(--err); }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .row + .row { margin-top: 8px; }
  textarea, select, input[type=text] { background: #100f0e; color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 7px 9px; font: inherit; }
  textarea { width: 100%; min-height: 58px; resize: vertical; }
  label { color: var(--muted); font-size: 13px; min-width: 64px; }
  select { flex: 1; min-width: 0; }
  .skull { display: flex; justify-content: center; padding: 6px 0 2px; }
  .meter { height: 8px; background: #100f0e; border-radius: 4px; overflow: hidden; flex: 1; }
  .meter > div { height: 100%; width: 0; background: var(--accent); transition: width 60ms linear; }
  .meter.mic > div { background: var(--visitor); }
  .meter.speech > div { background: var(--ok); }
  #log { height: 52vh; min-height: 280px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
  .msg { padding: 8px 11px; border-radius: 9px; max-width: 85%; }
  .msg .who { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
  .msg.skull { background: #2a1a0c; align-self: flex-start; }
  .msg.visitor { background: #14223a; align-self: flex-end; }
  .msg.test { background: #222; align-self: flex-start; }
  .msg.error { background: #3a1414; color: #ffb4b4; align-self: center; font-size: 13px; }
  .msg.timing { align-self: center; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .small { color: var(--muted); font-size: 12px; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: 13px; }
  td { padding: 2px 0; } td:last-child { text-align: right; }
</style>
</head>
<body>
<header>
  <h1>💀 Skull Brain</h1>
  <span class="pill state" id="state">connecting…</span>
  <span class="pill" id="presence">nobody here</span>
  <span class="pill" id="personaPill">Skeleton</span>
  <span class="pill" id="llmPill"></span>
  <span class="pill" id="skullPill"></span>
</header>
<main>
  <div>
    <section>
      <h2>Visitor</h2>
      <div class="row">
        <button class="primary" id="visitor">Visitor arrives (use mic)</button>
        <button id="leave">Visitor leaves</button>
        <button class="stop" id="stop" title="Stop immediately, no goodbye">Stop</button>
      </div>
      <div class="row" style="margin-top:12px">
        <textarea id="ask" placeholder="Typed questions, one per line, instead of speaking"></textarea>
      </div>
      <div class="row"><button id="askBtn">Visitor asks these</button><span class="small">The visit continues until "Visitor leaves"</span></div>
    </section>

    <section>
      <h2>Jaw &amp; mic</h2>
      <div class="skull">
        <svg width="150" height="150" viewBox="0 0 120 120" aria-label="jaw preview">
          <defs><radialGradient id="eye"><stop offset="0" stop-color="#ffe08a"/><stop offset=".5" stop-color="#ff7a1a"/><stop offset="1" stop-color="#5a1a00"/></radialGradient></defs>
          <path d="M60 8c-27 0-44 18-44 42 0 12 5 21 12 27v10h64V77c7-6 12-15 12-27C104 26 87 8 60 8z" fill="#d9d0c1"/>
          <circle cx="42" cy="50" r="12" fill="url(#eye)"/><circle cx="78" cy="50" r="12" fill="url(#eye)"/>
          <path d="M60 60l-6 12h12z" fill="#2a2420"/>
          <g id="jaw"><path d="M30 86h60v10c0 10-12 16-30 16S30 106 30 96z" fill="#cfc5b4"/>
            <path d="M40 86v8M48 86v9M56 86v9M64 86v9M72 86v9M80 86v8" stroke="#8a7f70" stroke-width="2"/></g>
          <path d="M40 80v7M48 80v7M56 80v7M64 80v7M72 80v7M80 80v7" stroke="#8a7f70" stroke-width="2"/>
        </svg>
      </div>
      <div class="row"><label>jaw</label><div class="meter"><div id="jawBar"></div></div></div>
      <div class="row"><label>mic</label><div class="meter mic"><div id="micBar"></div></div></div>
      <div class="row"><label>speech</label><div class="meter speech"><div id="speechBar"></div></div></div>
    </section>

    <section>
      <h2>Settings</h2>
      <div class="row"><label>speaker</label><select id="out"></select></div>
      <div class="row"><label>replies</label><select id="llm"></select></div>
      <p class="small" id="linesInfo"></p>
    </section>

    <section>
      <h2>Voices</h2>
      <div class="row"><label>persona</label><select id="pSel"></select></div>
      <div class="row"><label>engine</label><select id="pEngine"></select></div>
      <div class="row"><label>voice</label><select id="pVoice"></select><input type="text" id="pVoiceText" placeholder="voice id" style="flex:1;display:none"></div>
      <div class="row" id="pModelRow" style="display:none"><label>model</label><input type="text" id="pModel" placeholder="eleven_flash_v2_5" style="flex:1"></div>
      <div class="row"><label>speed</label><input type="range" id="pSpeed" min="0.6" max="1.4" step="0.02" style="flex:1"><span class="small val" data-for="pSpeed"></span></div>
      <div class="row"><label>effects</label><input type="checkbox" id="pEffects"><span class="small">pitch, chorus, reverb</span></div>
      <div class="row"><label>pitch</label><input type="range" id="pSemitones" min="-12" max="12" step="0.5" style="flex:1"><span class="small val" data-for="pSemitones"></span></div>
      <div class="row"><label>reverb</label><input type="range" id="pReverb" min="0" max="0.8" step="0.05" style="flex:1"><span class="small val" data-for="pReverb"></span></div>
      <div class="row"><label>chorus</label><input type="range" id="pChorus" min="0" max="0.8" step="0.05" style="flex:1"><span class="small val" data-for="pChorus"></span></div>
      <div class="row" id="pWeightRow"><label>possess</label><input type="range" id="pWeight" min="0" max="50" step="1" style="flex:1"><span class="small val" data-for="pWeight"></span></div>
      <div class="row"><label>character</label></div>
      <div class="row"><textarea id="pCharacter" style="min-height:110px"></textarea></div>
      <div class="row" style="margin-top:10px">
        <input type="text" id="sayText" placeholder="Preview this voice…" style="flex:1"><button id="sayBtn">Preview</button>
      </div>
      <div class="row">
        <button class="primary" id="pSave">Save to repo</button>
        <button id="possessBtn" title="This persona answers the next question">Possess next reply</button>
        <span class="small" id="pStatus"></span>
      </div>
    </section>
  </div>

  <div>
    <section>
      <h2>Conversation</h2>
      <div id="log"></div>
    </section>
    <section>
      <h2>Last turn timing (from end of question)</h2>
      <table id="timings"><tr><td class="small">No turns yet</td></tr></table>
    </section>
  </div>
</main>
<script>
const $ = id => document.getElementById(id);
let ws, settings = {};
function send(m) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(m)); }
function fill(sel, opts, val) {
  sel.innerHTML = opts.map(o => `<option${o === val ? ' selected' : ''}>${o}</option>`).join('');
}
function add(cls, who, text) {
  const d = document.createElement('div');
  d.className = 'msg ' + cls;
  d.innerHTML = who ? `<div class="who"></div><div class="t"></div>` : `<div class="t"></div>`;
  if (who) d.querySelector('.who').textContent = who;
  d.querySelector('.t').textContent = text;
  const log = $('log'); log.appendChild(d); log.scrollTop = log.scrollHeight;
}
function setJaw(v) {
  $('jawBar').style.width = (v * 100) + '%';
  $('jaw').setAttribute('transform', `translate(0 ${v * 14})`);
}
function connect() {
  ws = new WebSocket(`ws://${location.host}/ws`);
  ws.onclose = () => { $('state').textContent = 'disconnected'; setTimeout(connect, 1500); };
  ws.onmessage = ev => {
    const m = JSON.parse(ev.data);
    if (m.type === 'settings') {
      settings = m;
      fill($('llm'), m.llm_options, m.llm); fill($('out'), m.out_options, m.out);
      $('state').textContent = m.state;
      $('llmPill').textContent = m.llm === 'claude' ? m.model : 'canned replies (no API cost)';
      $('skullPill').textContent = 'skull: ' + m.skull;
      $('skullPill').className = 'pill' + (m.skull.startsWith('error') ? ' bad' : '');
      const cur = $('pSel').value || 'skeleton';
      $('pSel').innerHTML = Object.values(m.personas).map(p => `<option value="${p.id}">${p.name}</option>`).join('');
      $('pSel').value = cur in m.personas ? cur : 'skeleton';
      showPersona();
      const pname = m.personas[m.persona].name;
      $('personaPill').textContent = pname + (m.persona === 'skeleton' ? ` · possession chance ${Math.round(m.possess_chance * 100)}%` : ' (possessed!)');
      $('linesInfo').textContent = 'Lines: ' + Object.entries(m.lines).map(([k, v]) => `${v} ${k}`).join(', ');
    } else if (m.type === 'persona_data') {
      settings.personas[m.id] = m.data;
      dirty[m.id] = m.dirty;
      if ($('pSel').value === m.id) showPersona(true);
      if (m.saved) $('pStatus').textContent = `saved personas/${m.id}.json`;
    } else if (m.type === 'persona') {
      $('personaPill').textContent = m.id === 'skeleton' ? 'Skeleton' : m.name + ' (possessed!)';
      $('personaPill').style.color = m.id === 'skeleton' ? '' : '#d58bff';
    } else if (m.type === 'presence') {
      $('presence').textContent = m.present ? 'visitor present' : 'nobody here';
      $('presence').style.color = m.present ? 'var(--ok)' : '';
    } else if (m.type === 'state') {
      $('state').textContent = m.state;
    } else if (m.type === 'line') {
      const pname = m.persona && m.persona !== 'skeleton' && settings.personas ? settings.personas[m.persona].name : 'skull';
      const who = m.who === 'skull' ? pname + (m.backend ? ` · ${m.backend}` : '') + (m.filler ? ' · thinking' : '') + (m.event ? ` · ${m.event}` : '') : m.who;
      add(m.who, who === 'error' ? '' : who, m.text);
    } else if (m.type === 'jaw') {
      setJaw(m.v);
    } else if (m.type === 'mic') {
      $('micBar').style.width = Math.max(0, Math.min(100, (m.db + 70) * 1.6)) + '%';
      $('speechBar').style.width = (m.speech * 100) + '%';
    } else if (m.type === 'radar') {
      add('timing', '', m.cm == null ? 'radar: visitor left' : `radar: visitor at ${m.cm} cm`);
    } else if (m.type === 'timings') {
      const names = { stt: 'speech → text', filler: 'thinking filler starts', first_sentence: 'first sentence of reply', first_audio: 'answer ready to speak' };
      const rows = Object.entries(names).filter(([k]) => k in m).map(([k, n]) => `<tr><td>${n}</td><td>${m[k]} ms</td></tr>`);
      $('timings').innerHTML = rows.join('') || '<tr><td class="small">—</td></tr>';
      if ('first_audio' in m) add('timing', '', `answer ready ${(m.first_audio / 1000).toFixed(2)} s after the question` + ('filler' in m ? ` (filler at ${(m.filler / 1000).toFixed(2)} s)` : ''));
    }
  };
}
const dirty = {};
const P_FIELDS = { pEngine: 'engine', pVoice: 'voice', pVoiceText: 'voice', pModel: 'model', pSpeed: 'speed',
  pEffects: 'effects', pSemitones: 'semitones', pReverb: 'reverb', pChorus: 'chorus', pWeight: 'weight',
  pCharacter: 'character' };
function showPersona(keepFocus) {
  const p = settings.personas[$('pSel').value];
  if (!p) return;
  const eng = settings.engines;
  fill($('pEngine'), Object.keys(eng), p.engine);
  const voices = eng[p.engine] || [];
  const freeText = voices.length === 0;
  $('pVoice').style.display = freeText ? 'none' : '';
  $('pVoiceText').style.display = freeText ? '' : 'none';
  $('pModelRow').style.display = p.engine === 'elevenlabs' ? '' : 'none';
  fill($('pVoice'), voices.includes(p.voice) ? voices : [p.voice, ...voices], p.voice);
  for (const [id, key] of Object.entries(P_FIELDS)) {
    const el = $(id);
    if (keepFocus && document.activeElement === el) continue;
    if (el.type === 'checkbox') el.checked = !!p[key];
    else if (el.tagName !== 'SELECT') el.value = p[key] ?? '';
  }
  document.querySelectorAll('.val').forEach(v => { v.textContent = $(v.dataset.for).value; });
  $('pWeightRow').style.display = p.id === 'skeleton' ? 'none' : '';
  $('pStatus').textContent = dirty[p.id] ? 'unsaved changes' : '';
}
for (const [id, key] of Object.entries(P_FIELDS)) {
  const el = $(id);
  const commit = () => send({ cmd: 'persona_set', id: $('pSel').value, key,
    value: el.type === 'checkbox' ? el.checked : el.value });
  el.addEventListener('change', commit);
  if (el.type === 'range') el.addEventListener('input', () => {
    document.querySelector(`.val[data-for="${id}"]`).textContent = el.value; });
}
$('pSel').onchange = () => showPersona();
$('pSave').onclick = () => send({ cmd: 'persona_save', id: $('pSel').value });
$('possessBtn').onclick = () => send({ cmd: 'set', key: 'possess', value: $('pSel').value });
$('sayBtn').onclick = () => send({ cmd: 'preview', id: $('pSel').value,
  text: $('sayText').value || 'Come closer, little mortal, and ask me anything.' });
$('sayText').onkeydown = e => { if (e.key === 'Enter') $('sayBtn').click(); };
$('visitor').onclick = () => send({ cmd: 'visitor' });
$('leave').onclick = () => send({ cmd: 'leave' });
$('stop').onclick = () => send({ cmd: 'stop' });
$('askBtn').onclick = () => send({ cmd: 'ask', text: $('ask').value });
$('llm').onchange = e => send({ cmd: 'set', key: 'llm', value: e.target.value });
$('out').onchange = e => send({ cmd: 'set', key: 'out', value: e.target.value });
connect();
</script>
</body>
</html>

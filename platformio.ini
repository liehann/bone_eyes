; Talking skull firmware. `pio run -e skull -t upload`, `pio run -t uploadfs`
; for clips, `pio device monitor` for the console.

[platformio]
default_envs = skull

[env]
platform = espressif32@7.1.3          ; Arduino core 2.0.17 / IDF 4.4
board = esp32dev
framework = arduino
board_build.f_cpu = 240000000L
board_build.flash_mode = qio
board_build.flash_size = 8MB
board_upload.flash_size = 8MB
board_build.partitions = partitions_8mb.csv
board_build.filesystem = littlefs
upload_speed = 921600
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DCORE_DEBUG_LEVEL=1
    -Wall

; Primary: audio over Bluetooth A2DP to the speaker named in config.h.
[env:skull]
build_flags = ${env.build_flags} -DAUDIO_OUT=1

; Fallback: PCM5102 I2S DAC into the speaker's aux input. Not implemented in
; src/, and its old pins (26/25/22) now drive the right eye: re-pin in
; include/config.h before reviving it.
[env:skull_i2s]
build_flags = ${env.build_flags} -DAUDIO_OUT=2
